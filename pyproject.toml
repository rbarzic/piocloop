[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piocloop"
version = "0.1.0"
description = "TUI loop harness that orchestrates the PI coding agent to execute tasks from a PLAN.md file iteratively"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ronan Barzic", email = "rbarzic@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["pi", "pi-coding-agent", "ai", "tui", "automation", "textual"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/rbarzic/piocloop"
Repository = "https://github.com/rbarzic/piocloop"
Issues = "https://github.com/rbarzic/piocloop/issues"

[project.scripts]
piloop = "piocloop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/piocloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
